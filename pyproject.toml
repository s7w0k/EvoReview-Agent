# Configuration for the EvoReview-Agent closed-loop convergence plan
# (Phase 0: unified dev toolchain; sections 15.3 ruff / 15.4 mypy /
# 15.5 coverage). The ``evoagent`` package is importable from the repo root.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent"
version = "0.1.0"
description = "Production closed-loop self-evolving code-review agent runtime"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "coverage>=7",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg[binary]>=3",
    "redis>=5",
]

[tool.setuptools.packages.find]
include = ["evoagent*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Catch real problems (undefined names, unused imports, formatting) without
# forcing modernisation churn (UP) over the stdlib-only modules.
select = ["E", "F", "W"]
ignore = ["W292"]  # trailing-newline is cosmetic; skip to avoid churn

[tool.pytest.ini_options]
markers = [
  "integration: external dependency integration tests",
  "sqlite: sqlite integration tests",
  "postgres: postgres integration tests",
  "redis: redis integration tests",
  "e2e: end-to-end tests",
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true

# Type-check the core Harness / Evolution modules (section 3.5).
[[tool.mypy.overrides]]
module = [
    "evoagent.policy",
    "evoagent.tools",
    "evoagent.recovery",
    "evoagent.replay",
    "evoagent.procedure",
    "evoagent.policy_evolution",
    "evoagent.outcome_evolution",
    "evoagent.decision_trace",
]
disallow_untyped_defs = true

[tool.coverage.run]
source = ["evoagent"]
omit = ["*/tests/*"]
# Coverage gate is scoped to the core Harness / Evolution / control-plane
# modules (section 3.4) so an 85% floor stays meaningful without forcing tests
# on unrelated code.
include = [
    "evoagent/policy/*",
    "evoagent/tools/*",
    "evoagent/recovery/*",
    "evoagent/replay/*",
    "evoagent/procedure/*",
    "evoagent/policy_evolution/*",
    "evoagent/outcome_evolution/*",
    "evoagent/decision_trace/*",
    "evoagent/storage/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true