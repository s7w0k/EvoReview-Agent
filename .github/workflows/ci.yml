name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Unified development dependencies across every job: install the editable
  # package with the ``dev`` extra once instead of each job hand-picking a
  # different subset (plan section 3.1 / 3.2).
  PIP_DEFAULT_TIMEOUT: 60

jobs:
  # 15.1 unit: full unit suite on a matrix of Pythons.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests
      - run: python -c "import evoagent.policy, evoagent.tools, evoagent.recovery, evoagent.replay, evoagent.procedure, evoagent.policy_evolution, evoagent.evolution_gov, evoagent.memory_evolution, evoagent.outcome_evolution, evoagent.decision_trace, evoagent.storage, evoagent.a2a; print('all modules import ok')"

  # 15.3 lint: ruff check on the full corpus (fast, fails on style / unused imports).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check evoagent/storage evoagent/policy evoagent/policy_evolution evoagent/tools evoagent/recovery evoagent/replay evoagent/procedure evoagent/outcome_evolution evoagent/evolution_gov evoagent/decision_trace evoagent/execution evoagent/a2a services tests/integration tests/e2e tests/a2a

  # 15.4 typecheck: mypy on the core Harness / Evolution / control-plane modules.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy evoagent/policy evoagent/policy_evolution evoagent/tools evoagent/recovery evoagent/replay evoagent/procedure evoagent/outcome_evolution evoagent/storage

  # 15.5 coverage: harness core must hold >= 85%.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: coverage run -m pytest tests -q
      - name: Report scoped core coverage (>=85%)
        run: >-
          coverage report --fail-under=85
          --include="evoagent/policy/*,evoagent/policy_evolution/*,evoagent/tools/*,evoagent/recovery/*,evoagent/replay/*,evoagent/procedure/*,evoagent/outcome_evolution/*,evoagent/storage/*"

  # 15.2 sqlite-integration: whole suite SQLite-backed (default control plane).
  sqlite-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/integration -m sqlite -q
      - run: python -m pytest tests -q -m "not integration"

  # 15.1 harness-e2e: the full self-evolution closed-loop must always pass.
  harness-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/e2e -q

  # 15.1 + plan Phase 8: the foundational service-level production closed loop,
  # run on its own so a regression here is immediately diagnosable.
  closed-loop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/e2e/test_service_policy_deployment.py -q
      - run: python -m pytest tests/e2e/test_service_self_evolution_production_loop.py -q
      - run: python -m pytest tests/e2e/test_service_deployment_api.py -q

  # 15.1 + 15.6 evolution-regression: the Known-Good / Known-Bad fixtures.
  evolution-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_evolution_regression_fixtures.py -q

  # Plan Phase 9: run the deterministic Evolution Regression Benchmark and fail the
  # gate if the candidate policy is rejected by the hard safety gate.
  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_evolution_regression_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-eval-artifacts
          path: artifacts/evolution_eval/*.json

  # Real Multi-Agent closure (plan §5.3 / Phases 10-12). One job that enforces
  # the six hard gates end-to-end on the real runtime stack:
  #   1. true-parallel-execution      (WS1 timing gate)
  #   2. deep-loop-observation-driven
  #   3. targeted-replan-correctness
  #   4. dynamic-graph-safety          (no cycle / no self-cycle / fix after verify)
  #   5. runtime-eval-v4               (real six-agent runner, not synthetic)
  #   6. ablation-smoke                (7-variant real ablation over a corpus slice)
  # The CLI default stays on the runtime runner and never falls back to synthetic
  # (plan §5.8); attribution (plan §12) is produced by the same run.
  multi-agent-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # 1. true parallel hard gate: two 200ms fake agents must overlap (<320ms).
      - run: python -m pytest tests/multi_agent/test_parallel_execution.py -q
      # 2. deep loop gates: specialists actually drive observation -> tool.
      - run: python -m pytest tests/test_multi_agent_v2.py -k "deep_loop" -q
      # 3. targeted replan correctness + latest-version invalidation.
      - run: python -m pytest tests/multi_agent/test_replan_closed_loop.py tests/multi_agent/test_stale_artifact.py -q
      # 4. dynamic graph safety: validator rejects cycles; mutator is history-safe.
      - run: python -m pytest tests/test_multi_agent_v2.py -k "validator or graph_mutator or trigger or coordinator_v2" -q
      - run: python -m pytest tests/multi_agent/test_dynamic_graph_and_flags.py -q
      # 5 + 6. real runtime ablation smoke over a corpus slice (default matches
      # the published CLI: --runner runtime, non-synthetic by default).
      - run: python -m pytest tests/test_multi_agent_v2.py -k "v4_runtime or v4_ablation or corpus" -q
      - name: Real runtime 80-case ablation and JSON hard gates
        run: |
          python -m evoagent.evaluation_v4 --runner runtime \
            --out evaluation_v4_real.md --json-out evaluation_v4_real.json \
            --enforce-gates
          test -f evaluation_v4_real.json
          python - <<'PY'
          import json
          report = json.load(open("evaluation_v4_real.json", encoding="utf-8"))
          gates = report["hard_gates"]
          assert gates["passed"], {k: v for k, v in gates["gates"].items()
                                   if not v["passed"]}
          required = {
              "planner_routing_recall", "replan_correct_target_rate",
              "parallel_speedup", "deep_loop_advantage", "critic_fp",
              "verifier_fp", "graph_cycles", "graph_self_cycles",
              "fix_stale_inputs", "fix_after_verifier",
          }
          assert required <= set(gates["gates"])
          print("[gate] all Multi-Agent JSON hard assertions PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multi-agent-closure-artifacts
          path: |
            evaluation_v4_real.json
            evaluation_v4_real.md

  # Evaluation Harness V2 regression (plan Phase 13). Deterministic, no LLM cost:
  # verify the frozen dataset SHA, reproduce the 4 systems, evaluate the safety
  # gates, and upload the reproducible report so CI parses the exact numbers.
  evaluation-v2-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # plan section 18 test suite.
      - run: python -m unittest discover -s tests/evaluation_v2 -p "test_*.py"
      # reproduce all four systems (dataset SHA is verified inside the runner);
      # a fingerprint drift fails the job before any metric is trusted.
      - run: python scripts/run_e2e_evaluation_v2.py --stage all
      # fail the gate if the self-evolved candidate was rejected by any safety gate.
      - name: Assert safety gates pass
        run: |
          python - <<'PY'
          import json
          report = json.load(open("output/evaluation_v2/evaluation-report.json", encoding="utf-8"))
          gates = report.get("evolution", {}).get("safety_gates", {})
          assert gates.get("passed"), "safety gates FAILED %s" % gates.get("gates")
          systems = report.get("systems", {})
          assert "evolved_candidate" in systems, "Self-Evolved column missing from report"
          print("[gate] overall safety gate PASS for %s systems"
                % ", ".join(systems.keys()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-v2-artifacts
          path: |
            output/evaluation_v2/*.json
            output/evaluation_v2/*.md

  # Plan Phase 12: A2A Remote Specialist contract / integration / resilience.
  # Fast, dependency-light (stdlib HTTP server for tests, no FastAPI needed).
  a2a-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests/a2a -p "test_models.py"
      - run: python -m unittest discover -s tests/a2a -p "test_protocol.py"
      - run: python -m unittest discover -s tests/a2a -p "test_registry.py"
      - run: python -m unittest discover -s tests/a2a -p "test_security.py"

  # Phase 2 contract: the same A2ATask through InProcess == HTTP yields the
  # same A2AArtifact structure.
  a2a-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests/a2a -p "test_contract.py"

  # Phase 7: timeout / retry / circuit breaker / fallback / malformed-response.
  a2a-failure-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests/a2a -p "test_timeout.py"
      - run: python -m unittest discover -s tests/a2a -p "test_retry.py"
      - run: python -m unittest discover -s tests/a2a -p "test_fallback.py"

  # Phase 4/5: RemoteReviewerAdapter + HTTP transport end-to-end with a live
  # stdlib agent server; local vs remote equivalence.
  a2a-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests/a2a -p "test_http_transport.py"
      - run: python -m unittest discover -s tests/a2a -p "test_remote_reviewer.py"

  # Plan Phase 13 / 14: Evaluation Harness V3 Local-vs-Remote regression.
  evaluation-v3-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests/a2a -p "test_v3_evaluation.py"
      - uses: actions/upload-artifact@v4
        with:
          name: a2a-eval-artifacts
          path: output/a2a/*.json

  # 15.2 postgres-integration / redis-integration: exercise the extra adapters
  # against real services via the service containers.
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evoreview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EVOREVIEW_DB_DSN: postgresql://evo:evo@localhost:5432/evoreview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/integration -m "postgres" -q

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EVOREVIEW_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/integration -m "redis" -q
