# EvoReview A2A Remote Stack (plan Phase 12).
#
# Starts the review-api (Coordinator/Harness) plus the two Remote Specialist
# Agents over HTTP/JSON-RPC A2A, pointing the Coordinator at them.
#
#   docker compose -f docker-compose.a2a.yml up --build
services:
  security-agent:
    build:
      context: .
      dockerfile: services/security_agent/Dockerfile
    environment:
      EVOAGENT_A2A_TOKEN: ${EVOAGENT_A2A_TOKEN:-dev-a2a-shared-token}
      EVOAGENT_A2A_ENDPOINT: http://security-agent:8001/a2a
      EVOAGENT_A2A_DELAY_SECONDS: "0"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  reliability-agent:
    build:
      context: .
      dockerfile: services/reliability_agent/Dockerfile
    environment:
      EVOAGENT_A2A_TOKEN: ${EVOAGENT_A2A_TOKEN:-dev-a2a-shared-token}
      EVOAGENT_A2A_ENDPOINT: http://reliability-agent:8002/a2a
      EVOAGENT_A2A_DELAY_SECONDS: "0"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  review-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      EVOAGENT_HOST: 0.0.0.0
      EVOAGENT_PORT: "8080"
      # Feed the Remote A2A endpoints to the Coordinator's Agent Registry.
      EVOAGENT_A2A_ENDPOINTS: http://security-agent:8001/a2a,http://reliability-agent:8002/a2a
      EVOAGENT_A2A_TOKEN: ${EVOAGENT_A2A_TOKEN:-dev-a2a-shared-token}
    depends_on:
      security-agent:
        condition: service_healthy
      reliability-agent:
        condition: service_healthy